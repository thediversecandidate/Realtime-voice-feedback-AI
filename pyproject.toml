[project]
name = "realtime-voice-feedback-ai"
version = "0.1.0"
description = "Live call transcript thin client for GenesisAI -- surfaces cited talking points during expert-network calls"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
